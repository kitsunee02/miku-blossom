name: Check HsinOS configuration (blossom)

concurrency:
  group: hsin-blossom-config-check-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      hsin_branch:
        description: "HsinOS manifest branch"
        type: string
        default: "Moon_fox"
        required: true
      lunch_target:
        description: "Full lunch combo"
        type: string
        default: "hsin_blossom-bp1a-userdebug"
        required: true
      debug_terminal:
        description: "Enable private SSH terminal while checking configuration (requires Tailscale secrets)"
        type: boolean
        default: false
  push:
    paths:
      - "manifests/**"
      - "patches/**"
      - "overrides/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ROM_ROOT: /home/runner/rom
      ROM_VERSION: "15.0"
      DEVICE: blossom
      HSIN_BRANCH: ${{ inputs.hsin_branch || 'Moon_fox' }}
      LUNCH_TARGET: ${{ inputs.lunch_target || 'hsin_blossom-bp1a-userdebug' }}
      BUILD_TARGET: nothing
      KEEP_GIT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          path: hsin-blossom-ci
      - name: Validate private terminal configuration
        if: inputs.debug_terminal
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          CI_SSH_PUBLIC_KEY: ${{ secrets.CI_SSH_PUBLIC_KEY }}
        run: |
          [[ -n "$TS_OAUTH_CLIENT_ID" ]] || { echo "::error::Missing repository secret TS_OAUTH_CLIENT_ID"; exit 1; }
          [[ -n "$TS_OAUTH_SECRET" ]] || { echo "::error::Missing repository secret TS_OAUTH_SECRET"; exit 1; }
          [[ -n "$CI_SSH_PUBLIC_KEY" ]] || { echo "::error::Missing repository secret CI_SSH_PUBLIC_KEY"; exit 1; }
      - run: hsin-blossom-ci/scripts/free-space.sh
      - run: hsin-blossom-ci/scripts/disk-setup.sh /home/runner/rom 24
      - run: |
          hsin-blossom-ci/scripts/setup-runner.sh
          echo "REPO_DIR=$GITHUB_WORKSPACE/hsin-blossom-ci" >> "$GITHUB_ENV"
      - name: Join private Tailscale network
        if: inputs.debug_terminal
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: hsin-blossom-${{ github.run_id }}-check

      - name: Start read-only private SSH terminal
        if: inputs.debug_terminal
        env:
          CI_SSH_PUBLIC_KEY: ${{ secrets.CI_SSH_PUBLIC_KEY }}
          STAGE: check
        run: bash hsin-blossom-ci/scripts/start-debug-ssh.sh
      - run: hsin-blossom-ci/scripts/sync.sh
      - run: hsin-blossom-ci/scripts/apply-patches.sh
      - run: hsin-blossom-ci/scripts/prune.sh
      - name: Lunch and run m nothing
        run: |
          DEADLINE=$(( $(date +%s) + 150 * 60 ))
          hsin-blossom-ci/scripts/build-stage.sh "$DEADLINE" 0 nothing
          S=$(cat "$ROM_ROOT/status" 2>/dev/null || echo failed)
          echo "### HsinOS config check: $S" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$S" != done ]]; then
            tail -n 160 "$ROM_ROOT/src/out/error.log" 2>/dev/null || true
            exit 1
          fi
      - name: Collect runner diagnostics
        if: always()
        run: |
          mkdir -p /home/runner/rom/diagnostics
          OUT=/home/runner/rom/diagnostics/runner-diagnostics.txt
          {
            echo "=== Timestamp ==="; date -Is
            echo "=== Host / kernel ==="; uname -a
            echo "=== Uptime ==="; uptime
            echo "=== RAM and swap ==="; free -h; swapon --show || true
            echo "=== VM stats ==="; vmstat 1 5 || true
            echo "=== Memory pressure ==="; cat /proc/pressure/memory 2>/dev/null || true
            echo "=== Disk ==="; df -hT
            echo "=== Top memory processes ==="; ps aux --sort=-%mem | head -n 30
            echo "=== Cgroup memory ==="; for f in /sys/fs/cgroup/memory.{current,max,peak,events,stat}; do echo "--- $f"; cat "$f" 2>/dev/null || true; done
            echo "=== Kernel OOM / crash messages (dmesg) ==="; sudo dmesg -T 2>/dev/null | grep -Ei 'oom|out of memory|killed process|memory cgroup|segfault|panic' | tail -n 200 || true
            echo "=== Kernel OOM / crash messages (journal) ==="; sudo journalctl -k --since '-4 hours' 2>/dev/null | grep -Ei 'oom|out of memory|killed process|memory cgroup|segfault|panic' | tail -n 200 || true
            echo "=== ROM status ==="; cat /home/runner/rom/status 2>/dev/null || true
            echo "=== Soong/build logs ==="; ls -lh /home/runner/rom/src/out/{error.log,soong.log} 2>/dev/null || true
          } > "$OUT" 2>&1
          echo "Diagnostics saved: $OUT"
      - name: Disk report
        if: always()
        run: |
          df -h /home/runner/rom || true
          sudo btrfs filesystem usage -T /home/runner/rom || true
          du -sh --apparent-size /home/runner/rom/src 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: hsin-config-error
          path: |
            /home/runner/rom/src/out/error.log
            /home/runner/rom/src/out/soong.log
            /home/runner/rom/diagnostics/runner-diagnostics.txt
          if-no-files-found: ignore
